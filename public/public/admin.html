<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BankConnect Admin Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#071B36;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:#fff;
width:380px;
padding:35px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
text-align:center;
}

.login-box img{
width:90px;
margin-bottom:15px;
}

h2{
color:#071B36;
margin-bottom:10px;
}

p{
color:#666;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:13px;
background:#D4AF37;
color:#071B36;
font-size:16px;
font-weight:bold;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#c89b14;
}

.error{
color:red;
margin-top:10px;
}

</style>

</head>

<body>

<div class="login-box">

<img src="logo.png">

<h2>BankConnect Loans</h2>

<p>Administrator Login</p>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">

LOGIN

</button>

<p class="error" id="error"></p>

</div>

<script>

function login(){

const username=document.getElementById("username").value;
const password=document.getElementById("password").value;

if(username==="admin" && password==="BankConnect2026"){

sessionStorage.setItem("adminLoggedIn","true");

window.location.href="/submissions";

}else{

document.getElementById("error").innerHTML="Invalid username or password.";

}

}

</script>

</body>
</html>
